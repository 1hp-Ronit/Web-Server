<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Web Server</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f9f9f9; color: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; border: 1px solid #e5e5e5; border-radius: 12px; padding: 2rem; max-width: 480px; width: 90%; }
    .label { font-size: 11px; color: #999; font-family: monospace; margin-bottom: 1rem; }
    h1 { font-size: 24px; font-weight: 500; margin-bottom: 0.5rem; }
    p { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 1.25rem; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .tag { font-size: 12px; padding: 4px 10px; border-radius: 6px; }
    .tag-blue { background: #e6f1fb; color: #185fa5; }
    .tag-green { background: #eaf3de; color: #3b6d11; }
    .tag-amber { background: #faeeda; color: #854f0b; }
    .divider { border-top: 1px solid #eee; padding-top: 1rem; }
    a { font-size: 13px; color: #185fa5; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <p class="label">localhost:8080/</p>
    <h1>My Web Server</h1>
    <p>Built from scratch using raw Python sockets. No Flask. No frameworks. Just TCP, HTTP, and code.</p>
    <div class="tags">
      <span class="tag tag-blue">Python Sockets</span>
      <span class="tag tag-green">HTTP/1.1</span>
      <span class="tag tag-amber">No Frameworks</span>
    </div>
    <div class="divider">
      <a href="/about">About this project →</a>
    </div>
  </div>
</body>
</html>
